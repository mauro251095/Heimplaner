name: Tests

# Führt die 75 Checks aus test.html headless aus (siehe scripts/run-tests.mjs).
# Ersetzt nicht den manuellen Blick in den Browser vor einem Push, fängt aber
# ab, wenn der vergessen geht. Braucht keine Secrets — die Checks laufen rein
# gegen die Client-Logik, ohne Supabase/Netlify anzufassen.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
