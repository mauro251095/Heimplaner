<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover gehört zwingend zu apple-mobile-web-app-status-bar-style
     black-translucent unten: die Statusleiste liegt dann ÜBER der Seite, und
     die Seite hält sich den Platz selbst frei (siehe env(safe-area-inset-*)
     in app.css). Ohne cover sind diese Werte 0 und der Titel läge unter der
     Uhr. Wer eines von beiden ändert, muss das andere mitändern. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heimplaner</title>
<meta name="description" content="Persönlicher Haushaltsplaner für Mauro & Melissa">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#34332f">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heimplaner">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<!-- Android / allgemein -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Heimplaner">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">🏡 Heimplaner</div>
    <div id="sidebar-nav"></div>
  </nav>

  <div id="main">
    <div class="topbar">
      <div class="title">Heimplaner</div>
    </div>
    <div id="view-root"></div>
  </div>
</div>

<!-- Schnellwahl: nur auf dem Handy sichtbar, Inhalt kommt aus buildBottomNav() -->
<nav class="bottom-nav" id="bottom-nav"></nav>

<div class="drawer-scrim" id="drawer-scrim" onclick="closeDrawer()"></div>

<!-- Reihenfolge ist bindend: app.js definiert showModal/showToast/render, die
     die geteilten Dateien erwarten; die Ansichts-Dateien darunter hängen sich
     über VIEWS (app.js) ein und dürfen deshalb erst danach kommen. -->
<script src="heimplaner-login.js"></script>
<script src="heimplaner-data.js"></script>
<script src="app.js"></script>
<script src="tasks.js"></script>
<script src="heute.js"></script>
<script src="planer.js"></script>
<script src="shop.js"></script>
<script src="budget.js"></script>
<script src="meals.js"></script>
<script src="notes.js"></script>
<script src="birthdays.js"></script>
<script src="settings.js"></script>
<script src="heimplaner-sync.js"></script>
<script src="heimplaner-pwa.js"></script>
</body>
</html>
